<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelly Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      :root {
        /* A2UI basic catalog 主題覆寫 */
        --a2ui-color-primary: #6c5ce7;
        --a2ui-color-primary-light: #a29bfe;
        --a2ui-color-primary-dark: #5345c9;
        --a2ui-color-primary-hover: #7d70ea;
        --a2ui-color-on-primary: #ffffff;
        --a2ui-color-secondary: #00b894;
        --a2ui-color-surface: #ffffff;
        --a2ui-color-background: #f4f3fb;
        --a2ui-color-on-background: #2d3045;
        --a2ui-color-input: #f4f3fb;
        --a2ui-color-on-input: #2d3045;
        --a2ui-color-border: #e4e1f5;
        --a2ui-text-color-text: #2d3045;
        --a2ui-text-caption-color: #8b8fa8;
        --a2ui-border-radius: 16px;
        --a2ui-spacing-m: 14px;
      }
      body {
        margin: 0;
        padding: 16px 12px;
        background: linear-gradient(160deg, #ece9fb 0%, #f7f6fc 50%, #eef7f3 100%);
        min-height: 100vh;
        font-family: -apple-system, 'PingFang TC', sans-serif;
        color: #2d3045;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 480px;
        margin: 0 auto;
      }
      #error {
        color: #b00020;
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      // LIFF 規範要求 endpoint 頁面呼叫 liff.init；在 LINE 之外（TG/瀏覽器）開啟時 init 也能正常 resolve
      window.liff?.init({ liffId: '2012519525-9JLXzgxj' }).catch((e) => console.warn('liff init', e));
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="error"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
