<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelly Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      :root {
        /* ── Mobbin 風格主題：黑白灰 + 無邊框卡片 + 膠囊元件 ── */
        --a2ui-color-primary: #18181b;
        --a2ui-color-primary-light: #3f3f46;
        --a2ui-color-primary-dark: #09090b;
        --a2ui-color-primary-hover: #27272a;
        --a2ui-color-on-primary: #ffffff;
        --a2ui-color-secondary: #18181b;
        --a2ui-color-on-secondary: #ffffff;
        --a2ui-color-secondary-hover: #27272a;
        --a2ui-color-surface: #ffffff;
        --a2ui-color-background: #f5f5f7;
        --a2ui-color-on-background: #18181b;
        --a2ui-color-input: #f2f2f5;
        --a2ui-color-on-input: #18181b;
        --a2ui-color-border: #ececf0;
        --a2ui-text-color-text: #27272e;
        --a2ui-text-caption-color: #9a9ca8;
        --a2ui-border-radius: 20px;
        --a2ui-border-width: 0px;
        --a2ui-spacing-m: 14px;

        /* 卡片：無邊框、大圓角、柔和浮起 */
        --a2ui-card-background: #ffffff;
        --a2ui-card-border: none;
        --a2ui-card-border-radius: 24px;
        --a2ui-card-box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 12px 32px rgba(16, 24, 40, 0.07);
        --a2ui-card-padding: 22px;

        /* 按鈕：黑色膠囊 */
        --a2ui-button-background: #18181b;
        --a2ui-button-border: none;
        --a2ui-button-border-radius: 999px;
        --a2ui-button-padding: 13px 22px;
        --a2ui-button-margin: 6px 0;
        --a2ui-button-font-weight: 600;
        --a2ui-button-box-shadow: 0 2px 8px rgba(16, 24, 40, 0.18);

        /* Chips：膠囊單選 */
        --a2ui-choicepicker-chip-background: #f2f2f5;
        --a2ui-choicepicker-chip-background-selected: #18181b;
        --a2ui-choicepicker-chip-border: none;
        --a2ui-choicepicker-chip-border-radius: 999px;
        --a2ui-choicepicker-chip-padding: 9px 18px;
        --a2ui-choicepicker-chip-font-weight: 600;
        --a2ui-choicepicker-gap: 8px;
        --a2ui-choicepicker-label-color: #9a9ca8;

        /* Tabs：極簡文字型 */
        --a2ui-tabs-border: none;
        --a2ui-tabs-header-background: transparent;
        --a2ui-tabs-header-background-active: transparent;
        --a2ui-tabs-header-color: #9a9ca8;
        --a2ui-tabs-header-color-active: #18181b;
        --a2ui-tabs-content-padding: 14px 0 0 0;

        /* 輸入框：填色無邊框 */
        --a2ui-textfield-border: none;
        --a2ui-textfield-border-radius: 14px;
        --a2ui-textfield-padding: 14px 16px;
        --a2ui-textfield-color-border-focus: #18181b;

        /* 分隔線：極淡 */
        --a2ui-divider-border: 1px solid #f0f0f3;
        --a2ui-divider-spacing: 16px;
      }
      body {
        margin: 0;
        padding: 20px 14px calc(24px + env(safe-area-inset-bottom));
        background: #f5f5f7;
        min-height: 100vh;
        font-family: -apple-system, 'SF Pro Display', 'PingFang TC', sans-serif;
        color: #18181b;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 480px;
        margin: 0 auto;
      }
      #error {
        color: #b00020;
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
      // LIFF 規範要求 endpoint 頁面呼叫 liff.init；在 LINE 之外（TG/瀏覽器）開啟時 init 也能正常 resolve
      window.liff?.init({ liffId: '2012519525-9JLXzgxj' }).catch((e) => console.warn('liff init', e));
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="error"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
